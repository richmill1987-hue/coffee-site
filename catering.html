<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering - Resilient Luv Coffee</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li class="logo"><img src="Resilient_blacksmall.png" width="95" height="86"></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="catering.html" class="nav-catering">Catering</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <section class="page">
        <h1 class="menu-category">Catering Specials</h1>
        <p>Bring the truck to your next event! We provide bold brews and sweet treats for any occasion.</p>

        <div class="content-wrapper">
            <div class="image-container">
                <img src="coffeecupscircle.jpg" alt="Coffee Catering">
                <img src="sandwich.jpg" alt="Pastries">
                <img src="empanada.jpg" alt="Resilient Luv Truck">
            </div>

            <div class="about-text">
                <form class="contact-card" action="https://formspree.io/f/xjgaenrq" method="POST">
                    <div class="menu-info">
                        <h3>Book the Truck</h3>
                        <input type="text" name="name" placeholder="Your Name" required> 
                        <input type="email" name="email" placeholder="Email Address" required> 
                        <input type="text" name="event" placeholder="Event Type (Wedding, Corporate, etc.)">                        
                        <textarea name="message" placeholder="Tell us about your event..." rows="4"></textarea>
                        <button type="submit" class="location-badge" style="border:none; cursor:pointer; width:100%;">
                            Submit Inquiry
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Resilient Luv. All Rights Reserved.</p>
    </footer>
</body>
</html>
