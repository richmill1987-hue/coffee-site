<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering - Resilient Luv Coffee</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li class="logo"><img src="Resilient_blacksmall.png" width="95" height="86"></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="catering.html" class="nav-catering">Catering</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>

    <section class="page">
        <h1 class="menu-category">Catering Specials</h1>
        <p>Bring the truck to your next event! We provide bold brews and sweet treats for any occasion.</p>

        <div class="content-wrapper">
            <div class="image-container">
                <img src="coffeecupscircle.jpg" alt="Coffee Catering">
                <img src="sandwich.jpg" alt="Pastries">
                <img src="empanada.jpg" alt="Resilient Luv Truck">
            </div>

            <div class="about-text">
                <form id="my-form" class="contact-card" action="https://formspree.io/f/xjgaenrq" method="POST">
        <div class="menu-info">
          <h3>Book the Truck</h3>
          <input type="text" name="name" placeholder="Your Name" required>
          <input type="email" name="email" placeholder="Email Address" required>
          <input type="text" name="event" placeholder="Event Type (Wedding, Corporate, etc.)">
          <textarea name="message" placeholder="Tell us about your event..." rows="4"></textarea>
          
          <button type="submit" id="sub-button" class="location-badge" style="border:none; cursor:pointer; width:100%;">Submit Inquiry</button>
          
          <p id="status" style="margin-top: 10px; font-weight: bold;"></p>
        </div>
      </form>
    </div>
  </div>
</section>

<footer>
  <p>&copy; 2026 Resilient Luv. All Rights Reserved.</p>
</footer>

<script>
  var form = document.getElementById("my-form");
  
  async function handleSubmit(event) {
    event.preventDefault();
    var status = document.getElementById("status");
    var button = document.getElementById("sub-button");
    var data = new FormData(event.target);
    
    button.innerText = "Sending...";
    
    fetch(event.target.action, {
      method: form.method,
      body: data,
      headers: {
          'Accept': 'application/json'
      }
    }).then(response => {
      if (response.ok) {
        status.innerHTML = "Thanks! Your inquiry has been sent.";
        status.style.color = "green";
        button.innerText = "Sent!";
        form.reset();
      } else {
        response.json().then(data => {
          status.innerHTML = "Oops! There was a problem.";
          status.style.color = "red";
          button.innerText = "Submit Inquiry";
        })
      }
    }).catch(error => {
      status.innerHTML = "Oops! There was a problem submitting your form";
      status.style.color = "red";
      button.innerText = "Submit Inquiry";
    });
  }
  form.addEventListener("submit", handleSubmit)
</script>

</body>
</html>
